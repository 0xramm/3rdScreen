name: Build Windows exe

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name 3rdScreen --icon=assets/icon.ico --add-data "assets/icon.ico;assets" app.py

      - uses: actions/upload-artifact@v4
        with:
          name: 3rdScreen-windows
          path: dist/3rdScreen.exe
