name: Build Windows exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exe
        run: pyinstaller --onefile --windowed --name 3rdScreen --icon=assets/icon.ico --add-data "assets/icon.ico;assets" app.py

      - uses: actions/upload-artifact@v4
        with:
          name: 3rdScreen-windows
          path: dist/3rdScreen.exe

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/3rdScreen.exe --title "3rdScreen ${{ github.ref_name }}" --generate-notes
